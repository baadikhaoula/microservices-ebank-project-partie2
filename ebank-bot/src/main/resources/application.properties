spring.application.name=ebank-bot
server.port=8058

# ==========================================
# SPRING AI - GROQ CONFIGURATION
# ==========================================
spring.ai.groq.api-key=${GROQ_API}
spring.ai.groq.chat.options.model=llama-3.3-70b-versatile
# Désactiver OpenAI pour éviter les conflits au démarrage
spring.ai.openai.autoconfigure.enabled=false

# ==========================================
# SPRING CLOUD (Eureka & Config)
# ==========================================
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
