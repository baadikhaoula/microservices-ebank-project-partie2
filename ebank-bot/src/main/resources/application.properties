spring.application.name=ebank-bot
server.port=8058

# ==========================================
# CONFIGURATION SPRING AI - GROQ
# ==========================================
# 1. Remplacez 'gsk_...' par votre VRAIE clé API Groq (obtenue sur console.groq.com)
spring.ai.openai.api-key=${GROQ_API_KEY}

# 2. Cette ligne est CRUCIALE : elle dit à Spring d'utiliser les serveurs de Groq au lieu d'OpenAI
spring.ai.openai.base-url=https://api.groq.com/openai

# 3. Le modèle à utiliser (Llama 3.3 70B est excellent et gratuit sur Groq)
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# ==========================================
# AUTRES CONFIGURATIONS (Telegram, Eureka, etc.)
# ==========================================

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.jersey.enabled=false

# MCP Connections (pour plus tard)
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8057/mcp